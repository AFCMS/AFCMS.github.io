---
name: "CI"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/setup@v2
        with:
          install: true
          version: 12

      - name: Lint
        continue-on-error: true
        run: pnpm run lint

      - name: Check PWA Assets
        continue-on-error: true
        run: pnpm run generate-pwa-assets && git diff --exit-code

      - name: Build
        run: pnpm run build

  lighthouse:
    runs-on: ubuntu-latest
    needs: main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PNPM
        uses: pnpm/setup@v2
        with:
          install: true
          version: 12

      - name: Build project
        run: pnpm run build
        env:
          VITE_DISABLE_VERCEL_ANALYTICS: "true"

      - name: Run Lighthouse CI
        run: pnpm lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
